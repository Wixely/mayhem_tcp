name: Android test APK

on:
  push:
    tags: ['android-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out tagged source
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -notlike 'android-*') { throw 'Select an android-* tag' }
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
      - name: Install .NET Android workload
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer -UseBasicParsing
          $dotnetRoot = Join-Path $env:RUNNER_TEMP 'dotnet-android'
          & $installer -Version 10.0.300 -InstallDir $dotnetRoot
          if (!(Test-Path "$dotnetRoot/dotnet.exe")) { throw '.NET installation failed' }
          "DOTNET_ROOT=$dotnetRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $dotnetRoot | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dotnetRoot/dotnet.exe" workload install android --skip-manifest-update
          if ($LASTEXITCODE -ne 0) { throw 'Android workload installation failed' }
      - name: Install Android and Rust toolchains
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          "JAVA_HOME=$env:JAVA_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK/NDK installation failed' }
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target aarch64-linux-android
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Validate shared engine and build APK
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo fmt --manifest-path android/native/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Android formatting failed' }
          cargo test --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Shared tests failed' }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          $ndk = Join-Path $env:ANDROID_HOME 'ndk/28.2.13676358'
          ./scripts/build-android.ps1 -AndroidNdk $ndk
          & "$env:ANDROID_HOME/build-tools/36.0.0/apksigner.bat" verify --verbose .local/android/mayhem_tcp-android-arm64-test.apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature check failed' }
          ./scripts/check-android-artifacts.ps1
      - name: Publish Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $existing = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list releases' }
          if ($env:GITHUB_REF_NAME -notin $existing) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --prerelease --title "mayhem_tcp Android test build" --notes-file android/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem .local/android -File | Where-Object { $_.Extension -in '.apk', '.zip', '.sha256' } | Select-Object -ExpandProperty FullName)
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'APK upload failed' }
